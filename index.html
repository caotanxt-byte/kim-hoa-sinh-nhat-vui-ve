<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Kim Hoa</title>

<style>

body{
margin:0;
background:radial-gradient(circle,#101030,#000);
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* nút */

.controls{
position:relative;
z-index:9999;
margin-top:20px;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
background:#ff4d6d;
color:white;
font-size:15px;
cursor:pointer;
margin:6px;
}

/* sao */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.3}
to{opacity:1}
}

/* mic bar */

.micbar{
width:200px;
height:10px;
background:#333;
margin:10px auto;
border-radius:5px;
overflow:hidden;
}

.level{
height:100%;
width:0%;
background:#00ff88;
}

/* hộp quà */

.gift{
font-size:70px;
cursor:pointer;
animation:shake 1s infinite;
}

@keyframes shake{
0%{transform:rotate(-5deg)}
50%{transform:rotate(5deg)}
100%{transform:rotate(-5deg)}
}

/* bánh */

.cake{
display:none;
margin-top:30px;
animation:cakeBounce 2s infinite alternate;
}

@keyframes cakeBounce{
from{transform:translateY(0)}
to{transform:translateY(-5px)}
}

.layer{
background:#ffb6c1;
border-radius:12px;
margin:auto;
box-shadow:0 0 20px pink;
}

.layer1{width:220px;height:60px}
.layer2{width:170px;height:50px;margin-top:-10px}
.layer3{width:120px;height:40px;margin-top:-10px}

.cakeWrap{
position:relative;
width:220px;
margin:auto;
}

/* nến */

.candle{
width:10px;
height:35px;
background:white;
position:absolute;
top:-40px;
}

.candle:nth-child(1){left:60px}
.candle:nth-child(2){left:100px}
.candle:nth-child(3){left:140px}

.flame{
width:16px;
height:22px;
background:orange;
border-radius:50%;
position:absolute;
top:-20px;
box-shadow:0 0 20px orange;
animation:flicker .12s infinite;
}

@keyframes flicker{
50%{transform:scale(1.3)}
}

/* lời chúc */

.message{
margin-top:30px;
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
font-size:26px;
}

.line{
opacity:0;
transform:translateY(20px);
transition:1s;
}

.show{
opacity:1;
transform:translateY(0);
}

/* tim */

.heart{
position:absolute;
font-size:22px;
color:pink;
animation:rise 6s linear forwards;
}

@keyframes rise{
to{
transform:translateY(-700px);
opacity:0;
}
}

/* pháo hoa */

.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
animation:explode 1s forwards;
}

@keyframes explode{
to{
transform:scale(30);
opacity:0;
}
}

/* chữ kim hoa */

.fireText{
font-size:40px;
color:#ffd700;
margin-top:20px;
opacity:0;
animation:fade 3s forwards;
}

@keyframes fade{
to{opacity:1}
}

</style>
</head>

<body>

<h1>🎉 Happy Birthday Kim Hoa 🎉</h1>

<div class="gift" onclick="openGift()">🎁</div>

<div class="controls">

<button onclick="startMic()">🎤 Thổi bằng Mic</button>
<button onclick="blow()">💨 Thổi thủ công</button>

<div class="micbar">
<div class="level" id="level"></div>
</div>

</div>

<div class="cake" id="cake">

<div class="cakeWrap">

<div class="layer layer3"></div>
<div class="layer layer2"></div>
<div class="layer layer1"></div>

<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>

</div>

</div>

<div class="message">

<div class="line">Kim Hoa à ❤️</div>
<div class="line">Tuổi mới thật xinh đẹp ✨</div>
<div class="line">Tiền nhiều như lá 🍀</div>
<div class="line">Người yêu nhiều như sao ⭐</div>
<div class="line">Sớm trở thành đại gia bao cả thế giới 🌍</div>

</div>

<audio id="music"
src="https://cdn.pixabay.com/audio/2022/10/30/audio_3c2e0c1f11.mp3">
</audio>

<script>

/* sao */

for(let i=0;i<120;i++){

let star=document.createElement("div")

star.className="star"

star.style.left=Math.random()*100+"vw"

star.style.top=Math.random()*100+"vh"

document.body.appendChild(star)

}

/* mở quà */

function openGift(){

document.querySelector(".gift").style.display="none"

document.getElementById("cake").style.display="block"

}

/* mic */

let blown=false

async function startMic(){

try{

const stream=await navigator.mediaDevices.getUserMedia({audio:true})

const audioContext=new(window.AudioContext||window.webkitAudioContext)()

const source=audioContext.createMediaStreamSource(stream)

const analyser=audioContext.createAnalyser()

source.connect(analyser)

const data=new Uint8Array(analyser.frequencyBinCount)

function detect(){

analyser.getByteFrequencyData(data)

let volume=data.reduce((a,b)=>a+b)/data.length

document.getElementById("level").style.width=(volume*2)+"%"

if(volume>30 && !blown){

blown=true

blow()

}

requestAnimationFrame(detect)

}

detect()

}catch{

alert("Cho phép mic nhé 🎤")

}

}

/* thổi */

function blow(){

document.querySelectorAll(".flame").forEach((f,i)=>{

setTimeout(()=>{
f.style.display="none"
},i*400)

})

document.getElementById("music").play()

showMessage()

hearts()

fireworks()

showKimHoa()

}

/* tim */

function hearts(){

setInterval(()=>{

let h=document.createElement("div")

h.className="heart"

h.innerHTML="❤"

h.style.left=Math.random()*100+"vw"

h.style.top="80vh"

document.body.appendChild(h)

},300)

}

/* pháo hoa */

function fireworks(){

setInterval(()=>{

let f=document.createElement("div")

f.className="firework"

f.style.left=Math.random()*100+"vw"

f.style.top=Math.random()*60+"vh"

f.style.background=`hsl(${Math.random()*360},100%,60%)`

document.body.appendChild(f)

},500)

}

/* chữ kim hoa */

function showKimHoa(){

let t=document.createElement("div")

t.className="fireText"

t.innerHTML="🎆 KIM HOA 🎆"

document.body.appendChild(t)

}

/* lời chúc */

function showMessage(){

let lines=document.querySelectorAll(".line")

lines.forEach((line,i)=>{

setTimeout(()=>{

line.classList.add("show")

},i*1600)

})

}

</script>

</body>
</html>
